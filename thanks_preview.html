<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>感謝メッセージ プレビュー</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: 'Meiryo', sans-serif; background: #eef2f7; color: #2a3a4c;
    min-height: 100vh;
  }
  /* 背景（入力画面っぽいモック） */
  .mock-header {
    background: linear-gradient(135deg, #1a3a5c 0%, #0d2640 100%);
    color: #fff; padding: 16px 22px;
  }
  .mock-header h1 { font-size: 18px; margin: 0; }
  .mock-body { max-width: 560px; margin: 0 auto; padding: 22px 16px; }
  .mock-card { background: #fff; border-radius: 10px; box-shadow: 0 2px 10px rgba(0,0,0,.08); padding: 18px; }
  .mock-row { display: flex; justify-content: space-between; padding: 9px 4px; border-bottom: 1px solid #eee; font-size: 14px; }
  .mock-row span:last-child { color: #888; }

  .panel { max-width: 560px; margin: 8px auto 40px; padding: 0 16px; }
  .panel h2 { font-size: 15px; color: #1a3a5c; margin: 22px 0 6px; }
  .panel p { font-size: 12px; color: #777; margin: 0 0 12px; }
  .btnrow { display: flex; flex-wrap: wrap; gap: 8px; }
  .btn {
    padding: 10px 16px; border: none; border-radius: 8px; cursor: pointer;
    font-size: 14px; font-family: inherit; font-weight: bold;
  }
  .btn-main { background: #2e7d32; color: #fff; }
  .btn-main:hover { background: #256528; }
  .btn-sub { background: #fff; border: 1px solid #c5cfdb; color: #1a3a5c; font-weight: 600; font-size: 13px; }
  .btn-sub:hover { background: #f5f8fc; }
  .list { margin-top: 10px; }
  .list .chip {
    display: block; width: 100%; text-align: left; background: #fff; border: 1px solid #e3e8ef;
    border-radius: 8px; padding: 11px 14px; margin-bottom: 7px; cursor: pointer; font-size: 13px;
    color: #3a4a5c; line-height: 1.6; font-family: inherit;
  }
  .list .chip:hover { background: #f7faff; border-color: #b9c9dc; }

  /* ── 実際のトーストと同じスタイル ── */
  .ty-wrap {
    position: fixed; inset: 0; z-index: 400; display: flex; align-items: center; justify-content: center;
    background: rgba(20,30,45,0.28); backdrop-filter: blur(2px);
    animation: ty-bg-in .4s ease both; cursor: pointer;
  }
  .ty-wrap.ty-leaving { animation: ty-bg-out .5s ease both; }
  @keyframes ty-bg-in { from{opacity:0} to{opacity:1} }
  @keyframes ty-bg-out { from{opacity:1} to{opacity:0} }
  .ty-card {
    position: relative; background: linear-gradient(160deg,#fff 0%,#fff7f0 100%);
    border-radius: 20px; box-shadow: 0 18px 50px rgba(0,0,0,.25);
    padding: 30px 34px 22px; max-width: 380px; width: calc(100% - 48px); text-align: center;
    animation: ty-pop-in .5s cubic-bezier(.18,1.1,.5,1.05) both;
  }
  .ty-leaving .ty-card { animation: ty-pop-out .5s ease both; }
  @keyframes ty-pop-in { from{opacity:0;transform:translateY(24px) scale(.94)} to{opacity:1;transform:translateY(0) scale(1)} }
  @keyframes ty-pop-out { from{opacity:1;transform:translateY(0) scale(1)} to{opacity:0;transform:translateY(-14px) scale(.97)} }
  .ty-hearts { display:flex; justify-content:center; gap:14px; margin-bottom:12px; font-size:20px; }
  .ty-hearts span { display:inline-block; animation: ty-float 2.4s ease-in-out infinite; }
  .ty-hearts span:nth-child(1){ animation-delay:0s; color:#e58aa0; }
  .ty-hearts span:nth-child(2){ animation-delay:.35s; color:#e0b23a; font-size:22px; }
  .ty-hearts span:nth-child(3){ animation-delay:.7s; color:#e58aa0; }
  @keyframes ty-float { 0%,100%{transform:translateY(0);opacity:.85} 50%{transform:translateY(-7px);opacity:1} }
  .ty-msg { font-size:16px; line-height:1.8; color:#3a4a5c; font-weight:600; letter-spacing:.3px; }
  .ty-hint { margin-top:14px; font-size:11px; color:#bbb; }
</style>
</head>
<body>
  <div class="mock-header"><h1>松永工房　塗装部 生産入力（サンプル）</h1></div>
  <div class="mock-body">
    <div class="mock-card">
      <div class="mock-row"><span>4月</span><span>131本 / ¥971,346</span></div>
      <div class="mock-row"><span>5月</span><span>113本 / ¥313,600</span></div>
      <div class="mock-row"><span>6月</span><span>120本 / ¥2,694,800</span></div>
    </div>
  </div>

  <div class="panel">
    <h2>▼ 保存後に出る感謝メッセージ（プレビュー）</h2>
    <p>「保存する」を押した時のイメージです。毎回ランダムで、直前と同じ文は避けます。朝・夜は時間帯のあいさつが出ることも。</p>
    <div class="btnrow">
      <button class="btn btn-main" onclick="showRandom()">💾 保存する（ランダム表示）</button>
      <button class="btn btn-sub" onclick="showRandom()">もう一度ランダム</button>
    </div>

    <h2>▼ 全パターン（タップで個別に確認）</h2>
    <div class="list" id="list"></div>
  </div>

  <script>
    const MESSAGES = [
      'お疲れさまでした。今日も入力してくれてありがとう 🍵',
      'ひと手間、ありがとう。数字の向こうに、あなたの一日があります ✨',
      'しっかり届きました。塗装部のがんばり、ちゃんと残りましたよ 📖',
      'ありがとう。あなたの積み重ねが、工房の毎日をつくっています 🪵',
      '無事に保存できました。少し肩の力を抜いてね ☕',
      'いつも丁寧な入力をありがとう。頼りにしています 🌷',
      'おつかれさまです。あなたの一つひとつが、大きな力になっています 💪',
      'ありがとう。今日も一日、よくがんばりました 🌸',
      '記録できました。あなたの正確な仕事に、いつも助けられています 😊',
      '塗装部のみなさん、今日もありがとう。よい一日になりますように 🌱',
      'おはようございます。今日も一日、よろしくお願いします 🌅',
      '今日も一日おつかれさまでした。ゆっくり休んでね 🌙',
    ];
    let last = -1;
    function toast(msg) {
      const wrap = document.createElement('div');
      wrap.className = 'ty-wrap';
      wrap.innerHTML = '<div class="ty-card"><div class="ty-hearts"><span>♡</span><span>✨</span><span>♡</span></div><div class="ty-msg">'+msg+'</div><div class="ty-hint">タップで閉じる</div></div>';
      const close = () => { wrap.classList.add('ty-leaving'); setTimeout(()=>wrap.remove(),500); };
      wrap.onclick = close;
      document.body.appendChild(wrap);
      setTimeout(close, 4500);
    }
    function showRandom() {
      let i = Math.floor(Math.random()*10); // 通常メッセージ0..9
      if (i === last) i = (i+1)%10; last = i;
      toast(MESSAGES[i]);
    }
    const list = document.getElementById('list');
    MESSAGES.forEach(m => {
      const b = document.createElement('button');
      b.className = 'chip'; b.textContent = m;
      b.onclick = () => toast(m);
      list.appendChild(b);
    });
  </script>
</body>
</html>
